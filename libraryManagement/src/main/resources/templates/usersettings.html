<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");

        * {
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            display: flex;
            background-color: #E7F2F8;
        }

        body a {
            color: black;
            text-decoration: none; /* Optional: Remove underline */
        }

        body a:hover {
            color: darkviolet; /* Optional: Change color on hover */
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 110px;
            height: 100vh;
            padding: 0 1.9rem;
            color: #fff;
            overflow: hidden;
            transition: all 0.5s linear;
            background: rgba(113, 99, 186, 255);
        }

        .sidebar:hover {
            width: 300px;
            transition: 0.5s;
        }

        .logo {
            height: 80px;
            padding: 16px;
        }

        .menu {
            height: 88%;
            position: relative;
            list-style: none;
            padding: 0;
        }

        li {
            list-style: none;
            padding: 1rem;
            margin: 8px 0;
            border-radius: 8px;
            transition: all 0.5s ease-in-out;
        }

        li:hover, .active {
            background: #e0e0e058;
        }

        a {
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        span {
            overflow: hidden;
        }

        i {
            font-size: 1.2rem;
        }

        .logout {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
        }

        .main-content {
            margin-left: 110px;
            margin-top: 80px;
            flex-grow: 1;
            padding: 20px;
        }

        h1 {
            color: black;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: black;
        }

        form {
            max-width: 600px;
            margin: auto;
        }

        label {
            font-weight: bold;
            color: #495057;
        }

        input[type=text], input[type=number], input[type=email], input[type=tel] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 3px;
            box-sizing: border-box;
        }

        button[type=submit] {
            background-color: #4CAF50;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button[type=submit]:hover {
            background-color: #45A049;
        }

        .alert {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 5px;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4CAF50;
        }

        a:hover {
            text-decoration: underline;
        }

        .alert-success {
            display: none;
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
    </style>

    <script>
        function showSuccessMessage() {
            var successMessage = document.getElementById('success-message');
            successMessage.style.display = 'block';
            setTimeout(function() {
                successMessage.style.display = 'none';
            }, 3000);
        }

        function confirmUpdate(event) {
            event.preventDefault();
            if (confirm("Are you sure you want to update your profile?")) {
                showSuccessMessage();
                event.target.submit();
            }
        }
    </script>
</head>
<body>
<div class="sidebar">
    <div class="logo">
        <ul class="main">
            <span class="library-name"> Library Management System</span>
            <li>
                <a th:href="@{/userPortal}">
                    <i class="fas fa-home"></i> <span>Home</span>
                </a>
            </li>
            <li class="active">
                <a th:href="@{/help}">
                    <i class="fas fa-question-circle"></i> <span>Help</span>
                </a>
            </li>
            <li>
                <a th:href="@{/updateProfile}">
                    <i class="fas fa-cog"></i> <span>Settings</span>
                </a>
            </li>
            <li>
                <a th:href="@{/logout}">
                    <i class="fas fa-sign-out-alt"></i> <span>Sign Out</span>
                </a>
            </li>
        </ul>
    </div>
</div>
<div class="main-content">
    <div class="container">
        <h1>Profile settings</h1>

        <!-- Display error message if any -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Success message div -->
        <div id="success-message" class="alert alert-success">Profile updated successfully!</div>

        <form action="/updateProfile" th:object="${user}" method="post" onsubmit="confirmUpdate(event)">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" th:field="*{address}" class="form-control" id="address" required />
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" th:field="*{phoneNumber}" class="form-control" id="phoneNumber" required />
            </div>

            <div class="form-group">
                <label for="emailAddress">Email Address</label>
                <input type="email" th:field="*{emailAddress}" class="form-control" id="emailAddress" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="text" th:field="*{password}" class="form-control" id="password" required />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="text" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" required />
            </div>

            <div>
                <button type="submit">Update</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
