<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Book</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</head>
<body>

<div class="sidenav" id="sidenav">
    <div class="sidebar-header">
        <span class="library-name"> Library Management System</span>
    </div>
    <a href="/admin/dashboard">
        <i class="fas fa-plus icon"></i><span>Add a book</span></a>
    <a href="/admin/users">
        <i class="fas fa-users"></i> <span>Manage Users</span>
    </a>
    <a href="/admin/books/list">
        <i class="fas fa-book"></i> <span>Available Books</span>
    </a>
    <a href="/logout">
        <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
    </a>
</div>

<div class="main-content" id="main-content">
    <div id="addBook" class="container">
        <h2>Add a Book</h2>
        <form id="addBookForm" method="post" action="/admin/books/add">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required><br>

            <label for="isbn">ISBN (Book Number):</label>
            <input type="text" id="isbn" name="isbn" required><br>

            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="" disabled selected>Select or enter a category</option>
                <option value="new">Add New</option>
                <option value="Fiction">Fiction</option>
                <option value="Non-fiction">Non-fiction</option>
                <option value="Science Fiction">Science Fiction</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Mystery">Mystery</option>
                <option value="Romance">Romance</option>
            </select><br>

            <div id="newCategoryInput" style="display: none;">
                <label for="newCategory">New Category:</label>
                <input type="text" id="newCategory" name="newCategory" placeholder="Enter New Category"><br>
            </div>

            <label for="author">Author Name:</label>
            <input type="text" id="author" name="author" required><br>

            <label for="quantity">Number of Copies:</label>
            <input type="text" id="quantity" name="quantity" required><br>

            <button type="submit">Add Book</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
     const mainContent = document.getElementById("main-content");

     document.getElementById("category").addEventListener("change", function () {
         const newCategoryInput = document.getElementById("newCategoryInput");
         newCategoryInput.style.display = this.value === "new" ? "block" : "none";
     });

     document.getElementById("addBookForm").addEventListener("submit", function (event) {
         event.preventDefault(); // Prevent form submission

         const title = document.getElementById("title").value;
         const isbn = document.getElementById("isbn").value;
         let category = document.getElementById("category").value;
         if (category === "new") {
             category = document.getElementById("newCategory").value;
         }
         const author = document.getElementById("author").value;
         const quantity = document.getElementById("quantity").value;

         // Create a form object to send the data
         const formData = new FormData();
         formData.append("title", title);
         formData.append("isbn", isbn);
         formData.append("category", category);
         formData.append("author", author);
         formData.append("quantity", quantity);

         fetch("/admin/books/add", {
             method: "POST",
             body: formData
         }).then(response => {
             if (response.ok) {
                 mainContent.innerHTML = "<h2>Book Added Successfully</h2>";
             } else {
                 alert("Error adding book.");
             }
         }).catch(error => {
             console.error("Error:", error);
             alert("Error adding book.");
         });
     });
 });

 function openPage(pageName) {
     const mainContent = document.getElementById("main-content");
     if (pageName === 'addBook') {
         loadAddBookForm(mainContent);
     }
 }

 function loadAddBookForm(mainContent) {
     mainContent.innerHTML = document.getElementById("addBook").innerHTML;
 }

</script>

</body>
</html>
