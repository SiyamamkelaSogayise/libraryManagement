<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Library - List of Borrowed Books</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        /* Example CSS styles for the form */
        #addUserForm {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        #addUserForm label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #addUserForm input[type=text],
        #addUserForm input[type=email],
        #addUserForm input[type=password],
        #addUserForm input[type=date] {
            width: calc(100% - 20px);
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        #addUserForm button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }

        #addUserForm button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="sidenav" id="sidenav">
    <div class="sidebar-header">
        <!--<img src="Library.png" alt="Library.png" class="logo" style="width: 100px; height: auto;">-->
        <span class="library-name">Library Management System</span>
        </div>

    <a th:href="@{/admin/dashboard}">
        <i class="fas fa-plus icon"></i><span>Add a book</span></a>
    <a  th:href="@{/admin/users}" >
        <i class="fas fa-users"></i> <span>Manage Users</span>
    </a>
    <a th:href="@{/admin/books/list}">
        <i class="fas fa-book"></i> <span>Available Books</span>
    </a>
    <a href="/logout">
        <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
    </a>
    </div>


<div class="main-content">
    <div class="container">
        <h2>List User</h2>
        <button class="form-button" onclick="addNewUser()">Add New User</button>
        <table class="results-table" id="resultsTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email Address</th>
                <th>Phone number</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="usersTableBody">
            <tr th:each="user : ${users}">
                <td th:text=${user.id}>ID</td>
                <td th:text=${user.name}>Name</td>
                <td th:text=${user.emailAddress}>EmailAddress</td>
                <td th:text=${user.phoneNumber}>Phone Number</td>
                <td>
                    <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="btn btn-primary">Edit</a>
                    <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>

    </div>

    <div class="container" id="addUserContainer" style="display: none;">
        <h2>Add New User</h2>
        <form id="addUserForm" method="post" action="/admin/users/add">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required><br>

            <label for="phoneNumber">Phone Number:</label>
            <input type="text" id="phoneNumber" name="phoneNumber" required><br>

            <label for="emailAddress">Email Address:</label>
            <input type="email" id="emailAddress" name="emailAddress" required><br>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required><br>

            <label for="role">Role:</label>
            <input type="text" id="role" name="role" required><br>

            <button type="submit" class="form-button" >Add User</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    function openPage(pageName) {
        var addUserContainer = document.getElementById("addUserContainer");

        switch (pageName) {
            case 'manageUsers':
                loadManageUsers();
                break;
            case 'addBook':
                // Example placeholder for loading add book form
                break;
            case 'listBooks':
                // Example placeholder for loading list books
                break;
            case 'issueBook':
                // Example placeholder for loading issue book form
                break;
            case 'listIssuedBooks':
                // Example placeholder for loading list issued books
                break;
            case 'returnBooksToday':
                // Example placeholder for loading books to be returned today
                break;
            default:
                loadManageUsers();
                break;
        }
    }

    function loadManageUsers() {
        axios.get('/admin/users/list')
            .then(response => {
                var users = response.data;
                var usersTableBody = document.getElementById("usersTableBody");
                usersTableBody.innerHTML = ''; // Clear existing table rows

                users.forEach(user => {
                    var row = `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.emailAddress}</td>
                            <td>${user.phoneNumber}</td>
                            <td>
                                <button class="small-button" onclick="editUser(${user.id})">Edit</button>
                                <button class="small-button" onclick="deleteUser(${user.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                    usersTableBody.innerHTML += row;
                });
            })

    }

    function addNewUser() {
        var addUserContainer = document.getElementById("addUserContainer");

        // Hide manage users container and display add user container
        addUserContainer.style.display = "block";

    }

    function editUser(userId) {
        // Implement logic to edit a user
        alert("Functionality to edit user with ID: " + userId);
    }

    function deleteUser(userId) {
    if (confirm("Are you sure you want to delete this user?")) {
        axios.delete(`/admin/users/delete/${userId}`)
            .then(response => {
                alert(response.data.message);
                // Reload the user list after deletion
                loadManageUsers();
            })
            .catch(error => {
                alert("An error occurred while deleting the user.");
            });
    }
}




    // Initial load
    openPage('manageUsers');
</script>

</body>
</html>
