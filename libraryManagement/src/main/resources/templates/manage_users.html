<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Library - List of Borrowed Books</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="sidenav" id="sidenav">
    <div class="sidebar-header">
        <img src="Library.png" alt="Library.png" class="logo" style="width: 100px; height: auto;">
        <span class="library-name">System Library</span>
    </div>
    <a href="#" th:href="@{/manageUsers}">Manage Users</a>
    <a href="#" th:href="@{/admin/books/add}">Add a book</a>
    <a href="#" th:href="@{/list}" class="active">List of Books</a>
    <a href="#" th:href="@{/issueBook}">Issue Book</a>
    <a href="#" th:href="@{/listIssuedBooks}">List Issued Books</a>
    <a href="#" th:href="@{/returnBooksToday}">Books to be Returned Today</a>
</div>

<div class="main-content">
    <div class="container">
        <h2>List User</h2>
        <button class="form-button" onclick="addNewUser()">Add New User</button>
        <table class="results-table" id="resultsTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email Address</th>
                <th>Phone number</th>
                <th>Date of Birth</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="usersTableBody">
            <tr th:each="user : ${users}">
                <td th:text=${user.id}>ID</td>
                <td th:text=${user.name}>Name</td>
                <td th:text=${user.emailAddress}>EmailAddress</td>
                <td th:text=${user.phoneNumber}>Phone Number</td>
                <td th:text=${user.DateOfBirth}>Date of Birth</td>
                <td>
                    <button class="small-button" onclick="editUser(${user.id})">Edit</button>
                    <button class="small-button" onclick="deleteUser(${user.id})">Delete</button>
                </td>
            </tr>
            </tbody>
        </table>

    </div>

    <div class="container" id="addUserContainer" style="display: none;">
        <h2>Add New User</h2>
        <form id="addUserForm" method="post" action="/admin/users/add">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br>

            <label for="idNumber">ID Number:</label>
            <input type="text" id="idNumber" name="idNumber" required><br>

            <label for="dateOfBirth">Date of Birth:</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" required><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required><br>

            <label for="phoneNumber">Phone Number:</label>
            <input type="text" id="phoneNumber" name="phoneNumber" required><br>

            <label for="emailAddress">Email Address:</label>
            <input type="email" id="emailAddress" name="emailAddress" required><br>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required><br>

            <label for="role">Role:</label>
            <input type="text" id="role" name="role" required><br>

            <button type="submit" class="form-button" >Add User</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    function openPage(pageName) {
        var addUserContainer = document.getElementById("addUserContainer");

        switch (pageName) {
            case 'manageUsers':
                loadManageUsers();
                break;
            case 'addBook':
                // Example placeholder for loading add book form
                break;
            case 'listBooks':
                // Example placeholder for loading list books
                break;
            case 'issueBook':
                // Example placeholder for loading issue book form
                break;
            case 'listIssuedBooks':
                // Example placeholder for loading list issued books
                break;
            case 'returnBooksToday':
                // Example placeholder for loading books to be returned today
                break;
            default:
                loadManageUsers();
                break;
        }
    }

    function loadManageUsers() {
        axios.get('/admin/users/list')
            .then(response => {
                var users = response.data;
                var usersTableBody = document.getElementById("usersTableBody");
                usersTableBody.innerHTML = ''; // Clear existing table rows

                users.forEach(user => {
                    var row = `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.emailAddress}</td>
                            <td>${user.phoneNumber}</td>
                            <td>${user.dateOfBirth}</td>
                            <td>
                                <button class="small-button" onclick="editUser(${user.id})">Edit</button>
                                <button class="small-button" onclick="deleteUser(${user.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                    usersTableBody.innerHTML += row;
                });
            })

    }

    function addNewUser() {
        var addUserContainer = document.getElementById("addUserContainer");

        // Hide manage users container and display add user container
        addUserContainer.style.display = "block";

    }

    function editUser(userId) {
        // Implement logic to edit a user
        alert("Functionality to edit user with ID: " + userId);
    }

    function deleteUser(userId) {
        // Implement logic to delete a user
        alert("Functionality to delete user with ID: " + userId);
    }



    // Initial load
    openPage('manageUsers');
</script>

</body>
</html>
