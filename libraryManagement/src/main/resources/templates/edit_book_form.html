<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book</title>
    <!-- Include Bootstrap CSS for styling -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
<div class="container">
    <h2>Edit Book</h2>
    <form th:action="@{/admin/books/update}" th:object="${book}" method="post">
        <div class="form-group">
            <label for="id">ID</label>
            <input type="text" th:field="*{id}" class="form-control" id="id" readonly />
        </div>
        <div class="form-group">
            <label for="isbn">ISBN</label>
            <input type="text" th:field="*{isbn}" class="form-control" id="isbn" required />
        </div>
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" th:field="*{title}" class="form-control" id="title" required />
        </div>
        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" th:field="*{author}" class="form-control" id="author" required />
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" th:field="*{category}" class="form-control" id="category" required />
        </div>
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" th:field="*{quantity}" class="form-control" id="quantity" required min="1" />
        </div>
        <button type="submit" class="btn btn-primary">Update Book</button>
    </form>
</div>
<!-- Include Bootstrap JS for responsive behaviors -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
