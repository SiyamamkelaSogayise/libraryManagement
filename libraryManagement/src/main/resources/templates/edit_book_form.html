<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book</title>
    <!-- Include Bootstrap CSS for styling -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa; /* Light gray background */
        }
        .container {
            background-color: #ffffff; /* White background for the form container */
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1); /* Subtle shadow */
        }
        h2 {
            margin-bottom: 20px;
            color: #4CAF50; /* Bootstrap primary color for headings */
        }
        form {
            max-width: 600px;
            margin: auto;
        }
        label {
            font-weight: bold;
            color: #495057; /* Bootstrap gray color for labels */
        }
        input[type=text], input[type=number] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ced4da; /* Bootstrap form control border color */
            border-radius: 3px;
            box-sizing: border-box; /* Ensure padding and border are included in width */
        }
        button[type=submit] {
            background-color: #4CAF50;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button[type=submit]:hover {
            background-color: #4CAF50; /* Darker shade on hover */
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Edit Book</h2>
    <form th:action="@{/admin/books/update}" th:object="${book}" method="post">
        <div class="form-group">
            <label for="id">ID</label>
            <input type="text" th:field="*{id}" class="form-control" id="id" readonly />
        </div>
        <div class="form-group">
            <label for="isbn">ISBN</label>
            <input type="text" th:field="*{isbn}" class="form-control" id="isbn" required />
        </div>
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" th:field="*{title}" class="form-control" id="title" required />
        </div>
        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" th:field="*{author}" class="form-control" id="author" required />
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" th:field="*{category}" class="form-control" id="category" required />
        </div>
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" th:field="*{quantity}" class="form-control" id="quantity" required min="1" />
        </div>
        <button type="submit" class="btn btn-primary">Update Book</button>
    </form>
</div>
<!-- Include Bootstrap JS for responsive behaviors -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
