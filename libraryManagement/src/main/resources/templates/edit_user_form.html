<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>

    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa; /* Light gray background */
        }
        .container {
            background-color: #ffffff; /* White background for the form container */
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1); /* Subtle shadow */
        }
        h2 {
            margin-bottom: 20px;
            color: #4CAF50; /* Bootstrap primary color for headings */
        }
        form {
            max-width: 600px;
            margin: auto;
        }
        label {
            font-weight: bold;
            color: #495057; /* Bootstrap gray color for labels */
        }
        input[type=text], input[type=number] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ced4da; /* Bootstrap form control border color */
            border-radius: 3px;
            box-sizing: border-box; /* Ensure padding and border are included in width */
        }
        button[type=submit] {
            background-color: #4CAF50;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button[type=submit]:hover {
            background-color: #4CAF50; /* Darker shade on hover */
        }
    </style>
</head>
<body>
<h1>Edit User</h1>

<!-- Display error message if any -->
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form action="/updateUser" th:object="${user}" method="post" >

    <div class="form-group">
        <label for="id">ID</label>
        <input type="text" th:field="*{id}" class="form-control" id="id" readonly />
    </div>

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" th:field="*{name}" class="form-control" id="name" required />
    </div>

    <div class="form-group">
        <label for="address">Address</label>
        <input type="text" th:field="*{address}" class="form-control" id="address" required />
    </div>

    <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <input type="tel" th:field="*{phoneNumber}" class="form-control" id="phoneNumber" required />
    </div>

    <div class="form-group">
        <label for="emailAddress">Email Address</label>
        <input type="email" th:field="*{emailAddress}" class="form-control" id="emailAddress" required />
    </div>

    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" th:field="*{username}" class="form-control" id="username" required />
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="text" th:field="*{password}" class="form-control" id="password" required />
    </div>

    <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="text" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" required />
    </div>

    <div>
        <label for="role">Role:</label>
        <select id="role" name="role" required>
            <option value="USER" th:selected="*{role} == 'USER'">User</option>
            <option value="ADMIN" th:selected="*{role} == 'ADMIN'">Admin</option>
        </select>
    </div>

    <div>
        <button type="submit">Update User</button>
    </div>
</form>

<a href="/admin/users">Back to User List</a>

<script src="/path/to/your/js/scripts.js"></script>
</body>
</html>
